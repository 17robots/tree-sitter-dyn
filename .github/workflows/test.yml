name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  grammar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@just
      # Ubuntu's libtree-sitter is too old for parsers generated by 0.25.
      - name: Tree-sitter CLI and runtime 0.25.8
        run: |
          set -euo pipefail
          npm install --global tree-sitter-cli@0.25.8
          git clone --depth 1 --branch v0.25.8 https://github.com/tree-sitter/tree-sitter /tmp/tree-sitter
          make -C /tmp/tree-sitter -j"$(nproc)"
          sudo make -C /tmp/tree-sitter install PREFIX=/usr/local
          sudo ldconfig
      - name: Corpus, generated parser and highlight queries
        run: just test
